<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      /* Full-page background image (the <img> is at the top of <body>) */
      .page-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* fills the screen without stretching */
        z-index: -2;
      }
      /* Dark layer over the image so the text stays readable */
      .page-bg-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6); /* 0 = no darkening, 1 = black */
        z-index: -1;
      }

      /* Header sits over the page so the signup can center on the full screen */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 12px 30px 12px 0; /* same spacing as the portfolio page */
        z-index: 50;
      }

      /* Nav: HOME pill and hamburger grouped together on the right */
      .pill-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        width: max-content;
      }
      .hamburger-wrap {
        position: relative;
      }
      .mobile-menu-popover {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        left: auto;
        z-index: 100;
      }

      /* Newsletter signup, centered on the screen */
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .signup {
        max-width: 560px;
        width: 100%;
        padding: 0 24px;
        text-align: center;
        color: #fff;
      }
      .signup h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.1;
      }
      .signup p {
        margin: 0 0 28px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.75);
      }
      .signup-form {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .signup-form input[type="email"] {
        flex: 1 1 240px;
        padding: 14px 20px;
        border: 1px solid #6b3f3f;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 1rem;
      }
      .signup-form input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }
      .signup-form button {
        padding: 14px 28px;
        border: none;
        border-radius: 999px;
        background: #6b3f3f;
        color: #fff;
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      .signup-form button:hover {
        background: #845050;
      }
      .signup-form input:focus-visible,
      .signup-form button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .signup-message {
        margin-top: 14px;
        min-height: 1.5em;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.85);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- Page background image: change the path in src -->
    <img src="images/cthulhu-header-image.jpg" alt="" class="page-bg" />
    <div class="page-bg-overlay"></div>

    <!-- Header -->
    <header>
      <div class="pill-nav" aria-label="Site" id="pillNav">
        <div class="pill-nav-items" id="navItems">
          <ul class="pill-list" role="menubar" id="pillList"></ul>
        </div>

        <div class="hamburger-wrap" id="hamburgerWrap">
          <button
            class="mobile-menu-button"
            aria-label="Toggle menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
            id="hamburger"
          >
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </button>

          <div class="mobile-menu-popover" id="mobileMenu">
            <ul class="mobile-menu-list" id="mobileMenuList"></ul>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="signup">
        <h1>Don't Leave! Please Sign Up!</h1>
        <p>Get notified when I release new work and updates to this website!</p>
        <!-- Replace action with your provider's form URL (Mailchimp, Buttondown, ConvertKit, etc.) -->
        <form class="signup-form" id="signupForm" action="#" method="post">
          <label for="signupEmail" class="visually-hidden">Email address</label>
          <input
            type="email"
            id="signupEmail"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
          <button type="submit">Subscribe</button>
        </form>
        <p
          class="signup-message"
          id="signupMessage"
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>

    <script>
      (function () {
        const config = {
          homeItem: { label: "HOME", href: "index.html" },
          menuItems: [
            { label: "MY PORTFOLIO", href: "my_work/portfolio.html" },
            { label: "ABOUT ME", href: "about_me/about_me.html" },
            { label: "NEWSLETTER", href: "newsletter.html" },
          ],
          activeHref: "newsletter.html",
          ease: "power3.out",
          baseColor: "#fff",
          pillColor: "#6b3f3f",
          hoveredPillTextColor: "#6b3f3f",
          pillTextColor: null,
          initialLoadAnimation: true,
        };
        const resolvedPillTextColor = config.pillTextColor ?? config.baseColor;

        const navEl = document.getElementById("pillNav");
        const mobileMenuEl = document.getElementById("mobileMenu");
        [navEl, mobileMenuEl].forEach((el) => {
          el.style.setProperty("--base", config.baseColor);
          el.style.setProperty("--pill-bg", config.pillColor);
          el.style.setProperty("--hover-text", config.hoveredPillTextColor);
          el.style.setProperty("--pill-text", resolvedPillTextColor);
        });

        const pillListEl = document.getElementById("pillList");
        const mobileMenuListEl = document.getElementById("mobileMenuList");

        const homeLi = document.createElement("li");
        homeLi.setAttribute("role", "none");

        const homeLink = document.createElement("a");
        homeLink.setAttribute("role", "menuitem");
        homeLink.href = config.homeItem.href;
        homeLink.className =
          "pill" +
          (config.activeHref === config.homeItem.href ? " is-active" : "");
        homeLink.setAttribute(
          "aria-label",
          config.homeItem.ariaLabel || config.homeItem.label,
        );
        homeLink.textContent = config.homeItem.label;

        homeLi.appendChild(homeLink);
        pillListEl.appendChild(homeLi);

        config.menuItems.forEach((item) => {
          const mLi = document.createElement("li");
          const mA = document.createElement("a");
          mA.href = item.href;
          mA.className =
            "mobile-menu-link" +
            (config.activeHref === item.href ? " is-active" : "");
          mA.textContent = item.label;
          mA.addEventListener("click", () => closeMobileMenu());
          mLi.appendChild(mA);
          mobileMenuListEl.appendChild(mLi);
        });

        gsap.set(mobileMenuEl, { visibility: "hidden", opacity: 0, scaleY: 1 });

        if (config.initialLoadAnimation) {
          const navItems = document.getElementById("navItems");
          if (navItems) {
            gsap.set(navItems, { width: 0, overflow: "hidden" });
            gsap.to(navItems, {
              width: "auto",
              duration: 0.6,
              ease: config.ease,
            });
          }
        }

        const hamburger = document.getElementById("hamburger");
        const hamburgerWrap = document.getElementById("hamburgerWrap");
        let isMobileMenuOpen = false;
        let closeTimer = null;

        function openMobileMenu() {
          if (closeTimer) {
            clearTimeout(closeTimer);
            closeTimer = null;
          }
          if (isMobileMenuOpen) return;
          isMobileMenuOpen = true;
          hamburger.setAttribute("aria-expanded", "true");
          const lines = hamburger.querySelectorAll(".hamburger-line");
          gsap.to(lines[0], {
            rotation: 45,
            y: 3,
            duration: 0.3,
            ease: config.ease,
          });
          gsap.to(lines[1], {
            rotation: -45,
            y: -3,
            duration: 0.3,
            ease: config.ease,
          });

          gsap.set(mobileMenuEl, { visibility: "visible" });
          gsap.fromTo(
            mobileMenuEl,
            { opacity: 0, y: 10, scaleY: 1 },
            {
              opacity: 1,
              y: 0,
              scaleY: 1,
              duration: 0.3,
              ease: config.ease,
              transformOrigin: "top right",
            },
          );
        }

        function closeMobileMenu() {
          if (!isMobileMenuOpen) return;
          isMobileMenuOpen = false;
          hamburger.setAttribute("aria-expanded", "false");
          const lines = hamburger.querySelectorAll(".hamburger-line");
          gsap.to(lines[0], {
            rotation: 0,
            y: 0,
            duration: 0.3,
            ease: config.ease,
          });
          gsap.to(lines[1], {
            rotation: 0,
            y: 0,
            duration: 0.3,
            ease: config.ease,
          });

          gsap.to(mobileMenuEl, {
            opacity: 0,
            y: 10,
            scaleY: 1,
            duration: 0.2,
            ease: config.ease,
            transformOrigin: "top right",
            onComplete: () => gsap.set(mobileMenuEl, { visibility: "hidden" }),
          });
        }

        hamburgerWrap.addEventListener("mouseenter", openMobileMenu);
        hamburgerWrap.addEventListener("mouseleave", () => {
          closeTimer = setTimeout(closeMobileMenu, 150);
        });

        hamburger.addEventListener("click", () => {
          if (isMobileMenuOpen) closeMobileMenu();
          else openMobileMenu();
        });

        document.addEventListener("click", (e) => {
          if (isMobileMenuOpen && !hamburgerWrap.contains(e.target))
            closeMobileMenu();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeMobileMenu();
        });

        // Newsletter signup
        const signupForm = document.getElementById("signupForm");
        const signupMessage = document.getElementById("signupMessage");
        signupForm.addEventListener("submit", (e) => {
          // Once you set a real `action` URL, the form will post there instead.
          if (signupForm.getAttribute("action") === "#") {
            e.preventDefault();
            signupMessage.textContent = "Thanks! You're subscribed.";
            signupForm.reset();
          }
        });
      })();
    </script>
  </body>
</html>
